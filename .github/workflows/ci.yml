name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
            firefox-extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix mcp-server
          npm ci --prefix firefox-extension

      - name: Check versions agree
        run: npm run check-versions

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint extension
        run: npm run lint --prefix firefox-extension

      - name: Package extension
        run: npm run package --prefix firefox-extension

      - name: Package MCP server (DXT)
        working-directory: mcp-server
        run: |
          npm prune --omit=dev
          npm run pack-dxt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-control-mcp-${{ github.sha }}
          path: |
            firefox-extension/web-ext-artifacts/*.zip
            mcp-server/*.dxt
          if-no-files-found: error
